name: Build BY Windows

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      Link:
        description: 'UUP下载包链接'
        required: true

jobs:
  build:
    runs-on: windows-2022

    defaults:
      run:
        shell: powershell

    steps:
      - uses: actions/checkout@v4

      - name: Setup environment
        run: |
          # 强制 TLS 1.2（避免下载失败）
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12

          # 确保基础模块可用
          Import-Module Microsoft.PowerShell.Utility -ErrorAction SilentlyContinue

      - name: Download UUP package
        run: |
          Write-Host "Downloading UUP package..."
          Invoke-WebRequest -Uri "${{ inputs.Link }}" -OutFile "uup.zip"

      - name: Extract UUP package
        run: |
          Write-Host "Extracting..."
          Expand-Archive -Path "uup.zip" -DestinationPath "build" -Force

      - name: Replace config files
        run: |
          Write-Host "Replacing ConvertConfig.ini and CustomAppsList.txt..."

          $repoRoot = "${{ github.workspace }}"
          $buildDir = "$repoRoot\build"

          # 查找目标文件（防止路径不固定）
          $convertFile = Get-ChildItem -Path $buildDir -Recurse -Filter "ConvertConfig.ini" | Select-Object -First 1
          $appsFile = Get-ChildItem -Path $buildDir -Recurse -Filter "CustomAppsList.txt" | Select-Object -First 1

          # 替换 ConvertConfig.ini
          if (Test-Path "$repoRoot\ConvertConfig.ini") {
              if ($convertFile) {
                  Copy-Item "$repoRoot\ConvertConfig.ini" $convertFile.FullName -Force
                  Write-Host "ConvertConfig.ini replaced -> $($convertFile.FullName)"
              } else {
                  Write-Warning "ConvertConfig.ini not found in build"
              }
          } else {
              Write-Warning "Repo ConvertConfig.ini missing"
          }

          # 替换 CustomAppsList.txt
          if (Test-Path "$repoRoot\CustomAppsList.txt") {
              if ($appsFile) {
                  Copy-Item "$repoRoot\CustomAppsList.txt" $appsFile.FullName -Force
                  Write-Host "CustomAppsList.txt replaced -> $($appsFile.FullName)"
              } else {
                  Write-Warning "CustomAppsList.txt not found in build"
              }
          } else {
              Write-Warning "Repo CustomAppsList.txt missing"
          }
      - name: Run UUP script
        working-directory: build
        run: |
          Write-Host "Start UUP download script..."

          # 运行主脚本
          cmd /c "uup_download_windows.cmd"

      - name: Find ISO file
        id: get_iso_name
        working-directory: build
        run: |
          $iso = Get-ChildItem -Recurse -Filter "*.ISO" | Select-Object -First 1
          ls
          if (-not $iso) {
            Write-Error "ISO file not found!"
            exit 1
          }

          echo "iso_file=$($iso.Name)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          echo "iso_path=$($iso.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Split ISO
        working-directory: build
        run: |
          $iso = "${{ steps.get_iso_name.outputs.iso_path }}"
          Write-Host "Splitting ISO: $iso"
          # 1.5GB 分卷
          7z a -v1536m "$iso.zip" "$iso"
          ls

      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: $iso.zip
          release_name: "$iso.zip"
          draft: false
          prerelease: false

      - name: Upload ISO parts (main)
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: build\${{ steps.get_iso_name.outputs.iso_file }}.zip
          asset_name: ${{ steps.get_iso_name.outputs.iso_file }}.zip
          asset_content_type: application/zip

      - name: Upload part 001
        continue-on-error: true
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: build\${{ steps.get_iso_name.outputs.iso_file }}.zip.001
          asset_name: ${{ steps.get_iso_name.outputs.iso_file }}.zip.001
          asset_content_type: application/zip

      - name: Upload part 002
        continue-on-error: true
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: build\${{ steps.get_iso_name.outputs.iso_file }}.zip.002
          asset_name: ${{ steps.get_iso_name.outputs.iso_file }}.zip.002
          asset_content_type: application/zip

      - name: Upload part 003
        continue-on-error: true
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: build\${{ steps.get_iso_name.outputs.iso_file }}.zip.003
          asset_name: ${{ steps.get_iso_name.outputs.iso_file }}.zip.003
          asset_content_type: application/zip
